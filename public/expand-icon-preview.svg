<?xml version="1.0" encoding="UTF-8"?>
<!-- High-resolution preview of the "Mostrar más" button and icon -->
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- background page (transparent) -->
  <rect width="100%" height="100%" fill="transparent" />

  <!-- Button background: rounded rectangle like Moodle -->
  <g transform="translate(40,40)">
    <rect x="0" y="0" width="160" height="160" rx="10" ry="10" fill="#ffffff" stroke="#dcdcdc" stroke-width="3" />

    <!-- subtle inner shadow/edge to match small inset look -->
    <rect x="2" y="2" width="156" height="156" rx="8" ry="8" fill="none" stroke="rgba(0,0,0,0.02)" stroke-width="2" />

    <!-- The small arrow icon: down-right arrow similar to Moodle's -->
    <!-- Draw arrow shaft (diagonal) -->
    <path d="M56 46 L100 90" fill="none" stroke="#2b2b2b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Arrowhead: an L-shaped corner giving the down-right arrow look -->
    <path d="M84 90 L100 90 L100 74" fill="none" stroke="#2b2b2b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

    <!-- small marker/offset dot near arrow shaft to match reference (slightly lighter) -->
    <rect x="64" y="38" width="6" height="6" rx="1" ry="1" fill="#6f6f6f" />
  </g>
</svg>
